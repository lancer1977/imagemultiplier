name: ci

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: imagemultiplier-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XML validation tools
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: Validate repository shape
        run: bash scripts/validate.sh
